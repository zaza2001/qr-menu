<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome იკონებისთვის -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="restaurant-info">
                <h1 class="logo">Cafe Tiflis</h1>
                <span class="table-badge"><i class="fa-solid fa-utensils"></i> მაგიდა #4</span>
            </div>
            <button class="cart-btn" id="cartBtn">
                <i class="fa-solid fa-basket-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </header>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="მოძებნე კერძი ან სასმელი...">
        </div>

        <!-- Categories -->
        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" data-category="all">ყველა</button>
            <button class="category-btn" data-category="mains">მთავარი</button>
            <button class="category-btn" data-category="starters">წასახემსებელი</button>
            <button class="category-btn" data-category="drinks">სასმელები</button>
            <button class="category-btn" data-category="hotDish">ცხელი კერძები</button>

        </div>

        <!-- Menu List -->
        <main class="menu-container" id="menuContainer">
            <!-- კერძები ჩაიტვირთება JS-ით -->
        </main>
    </div>

    <!-- Cart Modal / Drawer -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>თქვენი შეკვეთა</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- კალათის ელემენტები -->
            </div>
            <div class="cart-footer">
                <div class="total-price">
                    <span>სულ:</span>
                    <span id="totalAmount">0.00 ₾</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">შეკვეთის გაგზავნა</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
