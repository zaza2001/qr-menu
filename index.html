<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome იკონებისთვის -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="restaurant-info">
                <h1 class="logo">Cafe Tiflis</h1>
                <span class="table-badge"><i class="fa-solid fa-utensils"></i> <span id="tableText">მაგიდა #</span></span>
            </div>
            
            <div class="header-right">
                <!-- Language Selector -->
                <select id="langSelect" class="lang-select">
                    <option value="ka">GE</option>
                    <option value="en">EN</option>
                    <option value="ru">RU</option>
                </select>

                <button class="cart-btn" id="cartBtn">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="მოძებნე კერძი ან სასმელი...">
        </div>

        <!-- Categories -->
        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" data-category="all">ყველა</button>
            <button class="category-btn" data-category="cold">ცივი კერძები</button>
            <button class="category-btn" data-category="salads">სალათები</button>
            <button class="category-btn" data-category="soups">წვნიანი კერძები</button>
            <button class="category-btn" data-category="hot">ცხელი კერძები</button>
            <button class="category-btn" data-category="steak">სტეიკი</button>
            <button class="category-btn" data-category="pastry">ცომეული</button>
            <button class="category-btn" data-category="khinkali">ხინკალი</button>
            <button class="category-btn" data-category="fish">თევზეული</button>
            <button class="category-btn" data-category="sides">გარნირი</button>
            <button class="category-btn" data-category="breakfast">საუზმე</button>
            <button class="category-btn" data-category="pizza">პიცა</button>
            <button class="category-btn" data-category="sauces">სოუსი</button>
            <button class="category-btn" data-category="desserts">დესერტი</button>
            <button class="category-btn" data-category="drinks">გამაგრილებელი სასმელები</button>
        </div>

        <!-- Menu List -->
        <main class="menu-container" id="menuContainer">
            <!-- კერძები ჩაიტვირთება JS-ით -->
        </main>
    </div>

    <!-- Cart Modal / Drawer -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2 id="cartTitle">თქვენი შეკვეთა</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- კალათის ელემენტები -->
            </div>
            <div class="cart-footer">
                <div class="cart-footer">
    <div class="price-row">
        <span>ქვეჯამი:</span>
        <span id="subtotalAmount">0.00 ₾</span>
    </div>
    <div class="price-row">
        <span>Tax (10%):</span>
        <span id="taxAmount">0.00 ₾</span>
    </div>
    <div class="price-row total-row">
        <span>სულ:</span>
        <span id="totalAmount">0.00 ₾</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">შეკვეთის გაგზავნა</button>
</div>
               
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
